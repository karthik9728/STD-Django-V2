<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand</title>
  </head>
  <body>
    <div class="page-header">
      <div class="title">Brand List</div>
      <div>+ New Brand</div>
    </div>
    <div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Created On</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for brand in brands %}
          <tr>
            <td>{{brand.name}}</td>
            <td>{{brand.created_on}}</td>
            <td>Details,Edit, Delete</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
