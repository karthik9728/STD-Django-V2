{% extends "base.html" %} {% block title %}Delete Category{% endblock %} {% block content %}
<div class="page-header">
  <div class="title">Delete Category</div>
  <div class="action-buttons">
    <a href="{% url 'category:list' %}" class="btn back-btn">Back</a>
  </div>
</div>

<div class="form-container">
  <div class="delete-message">
    Are you sure you want to delete
    <strong>{{ category.name }}</strong>
    ?
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="action-buttons">
      <button type="submit" class="btn delete-btn">Confirm Delete</button>

      <a href="{% url 'category:list' %}" class="btn back-btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
