{% extends "base.html" %} {% block title %}Category Details{% endblock %} {% block content %}
<div class="page-header">
  <div class="title">Category Details</div>
  <div class="action-buttons">
    <a href="/category" class="btn back-btn">Back</a>
  </div>
</div>
<div class="details-section">
  <div class="details-item">
    <div class="detail-label">Id</div>
    <div class="detail-data">{{category.id}}</div>
  </div>

  <div class="details-item">
    <div class="detail-label">Name</div>
    <div class="detail-data">{{category.name}}</div>
  </div>

  <div class="details-item">
    <div class="detail-label">Created On</div>
    <div class="detail-data">{{category.created_on}}</div>
  </div>
</div>
{% endblock %}
