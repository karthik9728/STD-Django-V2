{% if messages %}
<div class="toast-container">
  {% for message in messages %}
  <div class="toast toast-{{ message.tags }}">
    <span>{{ message }}</span>
    <button
      type="button"
      class="toast-close"
      onclick="this.parentElement.remove()"
    >
      &times;
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}

<script>
  document.querySelectorAll(".toast").forEach((toast) => {
    setTimeout(() => {
      toast.classList.add("toast-hide");

      setTimeout(() => {
        toast.remove();
      }, 300);
    }, 5000);
  });
</script>
