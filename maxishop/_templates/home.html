{% extends "base.html" %} {% block title %}Home | MaxiShop{% endblock %} {% block content %}

<div class="home-container">
  <section class="welcome-section">
    <h1>Welcome to MaxiShop</h1>
    <p>Manage your shopping platform from one place.</p>
  </section>

  <section class="dashboard-grid">
    <div class="dashboard-card">
      <h2>Brands</h2>
      <p>Manage your product brands.</p>
      <a href="{% url 'brand:list' %}" class="btn add-btn">Manage Brands</a>
    </div>

    <div class="dashboard-card">
      <h2>Categories</h2>
      <p>Manage your product categories.</p>
      <a href="{% url 'category:list' %}" class="btn add-btn">Manage Categories</a>
    </div>
  </section>
</div>
{% endblock %}
